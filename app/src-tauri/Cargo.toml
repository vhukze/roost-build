[package]
name = "droidbox"
version = "0.1.0"
description = "Windows native Android container manager"
authors = ["DroidBox"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "droidbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

tokio = { version = "1", features = ["process", "sync", "time", "io-util", "macros", "rt-multi-thread", "fs"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

regex = "1"
walkdir = "2"
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
